name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install locked dependencies & verify lockfile sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r backend/requirements.lock
          python -m pip install --no-deps -e backend
          python -m pip check
          python -m pip install -c backend/requirements.lock pytest pytest-asyncio pytest-xdist httpx mkdocs
          python -m pip check

      - name: Check bilingual docs & links
        run: python scripts/check-docs.py

      - name: Run backend test suite
        run: python -m pytest backend/tests -n auto -q

  backend-postgres:
    name: Backend PostgreSQL & Cluster Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentlab
          POSTGRES_PASSWORD: agentlab_ci_password
          POSTGRES_DB: agentlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U agentlab -d agentlab_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      AGENTLAB_TEST_POSTGRES_URL: postgresql+asyncpg://agentlab:agentlab_ci_password@127.0.0.1:5432/agentlab_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.lock
            backend/pyproject.toml

      - name: Install locked dependencies & verify lockfile sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r backend/requirements.lock
          python -m pip install --no-deps -e backend
          python -m pip check
          python -m pip install -c backend/requirements.lock pytest pytest-asyncio pytest-xdist httpx
          python -m pip check

      - name: Run PostgreSQL & multi-worker backend tests
        run: |
          python -m pytest \
            backend/tests/test_db_direct.py \
            backend/tests/test_db_portable.py \
            backend/tests/test_db_startup.py \
            backend/tests/test_copy_to_postgres.py \
            backend/tests/test_provenance_db.py \
            backend/tests/test_cluster.py \
            backend/tests/test_cluster_fence.py \
            backend/tests/test_multiprocess_e2e.py \
            -q

  frontend:
    name: Frontend Build & Static Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck & build frontend bundle
        run: pnpm --dir frontend build

      - name: Check shell script syntax
        run: |
          bash -n scripts/package-docker.sh
          bash -n scripts/dev.sh

      - name: Check bilingual docs & links
        run: python scripts/check-docs.py

      - name: Run static & runtime unit checks (tokens, copy, trace, decode)
        run: node scripts/check-all.mjs tokens copy trace decode
